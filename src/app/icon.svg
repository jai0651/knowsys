<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ee6b0"/>
      <stop offset="100%" stop-color="#45c8f5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2530"/>
      <stop offset="100%" stop-color="#061319"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none"
        stroke="#2ee6b0" stroke-opacity="0.24"/>

  <!-- A foundation, widening downward. Three equal bars read as a hamburger
       menu at 16px; a stack that gets broader toward the base does not, and it
       matches a site that works from the cache line up. -->
  <rect x="24" y="15" width="16" height="7"  rx="3.5" fill="url(#g)" opacity="0.5"/>
  <rect x="20" y="27" width="24" height="7"  rx="3.5" fill="url(#g)" opacity="0.74"/>
  <rect x="15" y="39" width="34" height="10" rx="5"   fill="url(#g)"/>
</svg>
